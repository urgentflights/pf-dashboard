# PF Dashboard. Apply from the repo after this file is on main:
# https://dashboard.render.com/blueprint/new?repo=https://github.com/urgentflights/pf-dashboard
# TEAM_PASSWORD is entered in the Dashboard on the first Blueprint create.
# INGEST_TOKEN and SECRET_KEY are generated once and then left alone.
# Database is on the paid Basic plan (always kept).
services:
  - type: web
    name: pf-dashboard
    runtime: python
    plan: starter
    region: virginia
    branch: main
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pf-dashboard-db
          property: connectionString
      - key: TEAM_PASSWORD
        sync: false
      - key: INGEST_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: pf-dashboard-db
    plan: basic-256mb
    diskSizeGB: 1
    region: virginia
    databaseName: pf_dashboard_db
    user: pf_dashboard_db_user
    postgresMajorVersion: "16"
    ipAllowList: []
